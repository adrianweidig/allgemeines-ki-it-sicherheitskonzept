version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Geplante Versionsaktualisierungen erzeugen keine Arbeitszweige.
    # Dependabot-Sicherheitswarnungen bleiben davon unberührt.
    open-pull-requests-limit: 0
    labels:
      - abhängigkeiten

  - package-ecosystem: pip
    directory: /validierung
    schedule:
      interval: monthly
    # Geplante Versionsaktualisierungen erzeugen keine Arbeitszweige.
    # Dependabot-Sicherheitswarnungen bleiben davon unberührt.
    open-pull-requests-limit: 0
    labels:
      - abhängigkeiten
      - validierung
