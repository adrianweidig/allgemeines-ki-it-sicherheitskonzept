version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - abhängigkeiten

  - package-ecosystem: pip
    directory: /validierung
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - abhängigkeiten
      - validierung
