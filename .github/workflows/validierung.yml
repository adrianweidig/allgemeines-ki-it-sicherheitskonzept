name: Projekt validieren

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validierung-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validierung:
    name: Fachartefakte und Veröffentlichungsgrenzen prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: validierung/anforderungen.txt

      - name: Prüfabhängigkeiten installieren
        run: python -m pip install --requirement validierung/anforderungen.txt

      - name: Negativtests ausführen
        run: python -m unittest discover -s validierung/testfälle -p "test_*.py" -v

      - name: Ausschluss lokaler Eingaben nachweisen
        shell: bash
        run: |
          git check-ignore --quiet --no-index quellen/lokale-eingaben/pruefdatei.pdf
          test -z "$(git ls-files 'quellen/lokale-eingaben/**')"

      - name: Projekt und öffentliche Quellen streng validieren
        run: python validierung/validiere_projekt.py --streng --online
